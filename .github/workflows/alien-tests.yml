name: Alien Bot Syntax and Score Tests

on:
  push:
    paths:
      - 'alien_bot/**'
      - 'tests/test_alien_score.py'
      - '.github/workflows/alien-tests.yml'
  pull_request:
    paths:
      - 'alien_bot/**'
      - 'tests/test_alien_score.py'
      - '.github/workflows/alien-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install discord.py pymongo
      - name: Compile alien bot
        run: python -m compileall -q alien_bot
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_alien_score.py' -v
